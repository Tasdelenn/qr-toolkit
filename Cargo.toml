[package]
name = "qr-toolkit"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust + WebAssembly QR code encoder and decoder"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
